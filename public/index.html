<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON BATTLE - ED. FÍSICA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050510;color:#fff;font-family:'Segoe UI';overflow:hidden}
.top{display:flex;justify-content:space-between;padding:10px 14px}.logo{font-weight:900;font-size:20px}.logo span{background:linear-gradient(90deg,#22c55e,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pill{background:#ffffff15;border:1px solid #ffffff30;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px}
#arena{margin:0 10px;height:52vh;background:linear-gradient(180deg,#0f2e1a,#050510);border:2px solid #22c55eaa;border-radius:24px;position:relative;overflow:hidden}
.player{position:absolute;transform:translate(-50%,-50%);text-align:center}.player .avatar{font-size:38px;filter:drop-shadow(0 0 12px #22c55e)}.player .name{font-size:10px;background:#000d;padding:3px 7px;border-radius:999px}.pts{font-size:11px;background:#facc15;color:#000;font-weight:900;padding:2px 6px;border-radius:999px}
#feed{padding:8px 12px}.feed-item{background:#ffffff10;border-left:3px solid #22c55e;padding:6px 10px;border-radius:10px;font-size:13px;margin:3px 0}
.controls{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;padding:0 16px}
#joy{width:110px;height:110px;background:#ffffff15;border:2px solid #ffffff40;border-radius:50%;position:relative}#knob{width:48px;height:48px;background:linear-gradient(135deg,#22c55e,#22d3ee);border-radius:50%;position:absolute;left:31px;top:31px}
#menu{padding:20px}.card{background:#ffffff10;border:1px solid #ffffff25;border-radius:24px;padding:18px}input{width:100%;padding:14px;border-radius:14px;border:none;background:#1a1a35;color:#fff;margin:8px 0;font-size:16px}
.skins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.skin{font-size:32px;padding:10px;background:#1a1a35;border-radius:16px;border:2px solid transparent}.skin.sel{border-color:#22c55e}
#duelo{position:fixed;inset:0;background:#000e;z-index:30;display:none;align-items:center;justify-content:center;padding:16px}.duelo-card{background:#11112e;border:2px solid #22c55e;border-radius:24px;padding:20px;width:100%;max-width:400px;text-align:center}
.duelo-card button{width:100%;padding:14px;margin:6px 0;border-radius:14px;border:none;background:#22c55e33;border:1px solid #22c55e;color:#fff;font-size:15px;font-weight:700}
#meusPontos{position:fixed;top:70px;right:12px;background:#facc15;color:#000;padding:8px 14px;border-radius:999px;font-weight:900;z-index:10}
</style></head><body>
<div id="menu"><div style="text-align:center;font-size:34px;font-weight:900">⚡ NEON <span style="color:#22c55e">BATTLE</span></div><p style="text-align:center">EDUCAÇÃO FÍSICA • Encoste = +100 PONTOS • Ninguém é eliminado! • 5 MIN</p><div class="card"><input id="nome" placeholder="Seu nick..." value="Player1"><div class="skins" id="skins"></div><input id="codigo" value="NEON1"><button onclick="entrar()" style="background:linear-gradient(90deg,#22c55e,#22d3ee);color:#fff;border:none;padding:14px;border-radius:14px;font-weight:900;width:100%">▶️ ENTRAR NA BATALHA</button></div></div>
<div id="jogo" style="display:none"><div class="top"><div class="logo">⚡ NEON <span>BATTLE EF</span></div><div class="pill">⏰ <span id="tempo">5:00</span> • 👥 <span id="vivos">0</span></div></div><div id="meusPontos">⭐ 0 PTS</div><div style="padding:0 10px"><button onclick="comecar()" style="background:#22c55e;color:#fff;border:none;padding:10px;border-radius:12px;width:100%;font-weight:900">▶️ PROFESSOR: INICIAR</button></div><div id="arena"></div><div id="feed"></div><div class="controls"><div id="joy"><div id="knob"></div></div></div></div>
<div id="duelo"><div class="duelo-card"><div style="font-size:40px">🧠⚔️</div><h3 id="dueloVs">DUELO!</h3><p id="dueloPergunta" style="font-size:18px;font-weight:700"></p><div id="dueloOps"></div></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
let socket=io(),minhaSkin='🦊',pos={x:400,y:250},meusPontos=0,meuNome='';
let skins=['🦊','🐲','⚽','🏀','🏐','🥋','🏋️','🤸','🏃','🚴'];
let div=document.getElementById('skins');
skins.forEach(s=>{let b=document.createElement('div');b.className='skin'+(s==='🦊'?' sel':'');b.innerText=s;b.onclick=()=>{minhaSkin=s;document.querySelectorAll('.skin').forEach(e=>e.classList.remove('sel'));b.classList.add('sel')};div.appendChild(b)});
function entrar(){meuNome=document.getElementById('nome').value;socket.emit('entrar',{codigo:document.getElementById('codigo').value,nome:meuNome,skin:minhaSkin});document.getElementById('menu').style.display='none';document.getElementById('jogo').style.display='block'}
function comecar(){socket.emit('comecar')}
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),movendo=false,dx=0,dy=0;
function jm(e){let r=joy.getBoundingClientRect();let cx=e.touches?e.touches[0].clientX:e.clientX;let cy=e.touches?e.touches[0].clientY:e.clientY;dx=Math.max(-30,Math.min(30,cx-(r.left+55)));dy=Math.max(-30,Math.min(30,cy-(r.top+55)));knob.style.left=(31+dx)+'px';knob.style.top=(31+dy)+'px'}
joy.addEventListener('touchmove',e=>{e.preventDefault();movendo=true;jm(e)});joy.addEventListener('touchend',()=>{movendo=false;dx=dy=0;knob.style.left='31px';knob.style.top='31px'});
setInterval(()=>{if(movendo){pos.x=Math.max(20,Math.min(780,pos.x+dx*0.4));pos.y=Math.max(20,Math.min(420,pos.y+dy*0.4));socket.emit('mover',pos)}},30);
let keys={};addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
setInterval(()=>{let vx=0,vy=0;if(keys['ArrowLeft']||keys['a'])vx=-8;if(keys['ArrowRight']||keys['d'])vx=8;if(keys['ArrowUp']||keys['w'])vy=-8;if(keys['ArrowDown']||keys['s'])vy=8;if(vx||vy){pos.x+=vx;pos.y+=vy;socket.emit('mover',pos)}},30);
socket.on('duelo',d=>{document.getElementById('duelo').style.display='flex';document.getElementById('dueloVs').innerText='⚔️ DUELO vs '+d.oponente+' • Acerte = +100 PTS';document.getElementById('dueloPergunta').innerText=d.pergunta.q;let ops=document.getElementById('dueloOps');ops.innerHTML='';d.pergunta.a.forEach((alt,i)=>{let b=document.createElement('button');b.innerText=alt;b.onclick=()=>{socket.emit('responder',{correta:i===d.pergunta.c})};ops.appendChild(b)})});
socket.on('duelo-fim',d=>{document.getElementById('duelo').style.display='none';if(d.resultado==='ganhou'){meusPontos=d.pontos;document.getElementById('meusPontos').innerText='⭐ '+meusPontos+' PTS';alert('✅ +100 PONTOS! Você tem '+meusPontos)}if(d.resultado==='errou')alert('❌ Errou! Tente de novo no próximo duelo')});
socket.on('podio',ranking=>{
let div2=document.createElement('div');div2.style.cssText='position:fixed;inset:0;background:#000e;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px';
let p1=ranking[0]?.nome||'---',p2=ranking[1]?.nome||'---',p3=ranking[2]?.nome||'---';let k1=ranking[0]?.pontos||0,k2=ranking[1]?.pontos||0,k3=ranking[2]?.pontos||0;
div2.innerHTML=`<div style="background:#11112e;border:2px solid #facc15;border-radius:24px;padding:24px;width:100%;max-width:400px"><div style="font-size:60px">🏆</div><h1 style="margin:0">PÓDIO FINAL!</h1><p>Quem fez MAIS PONTOS venceu!</p><div style="display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0"><div><div style="font-size:30px">🥈</div><div style="background:#94a3b8;padding:10px;border-radius:12px 12px 0 0;height:70px"><b>${p2}</b><br>⭐ ${k2} pts</div></div><div><div style="font-size:40px">🥇</div><div style="background:#facc15;color:#000;padding:12px;border-radius:12px 12px 0 0;height:110px"><b>${p1}</b><br>👑 CAMPEÃO<br>⭐ ${k1} pts</div></div><div><div style="font-size:30px">🥉</div><div style="background:#b45309;padding:10px;border-radius:12px 12px 0 0;height:50px"><b>${p3}</b><br>⭐ ${k3} pts</div></div></div><button onclick="location.reload()" style="background:#22c55e;color:#fff;border:none;padding:14px;border-radius:14px;font-weight:900;width:100%">🔁 JOGAR DE NOVO</button></div>`;document.body.appendChild(div2);});
socket.on('estado',s=>{let min=Math.floor(s.tempo/60);let seg=String(s.tempo%60).padStart(2,'0');document.getElementById('tempo').innerText=min+':'+seg;document.getElementById('vivos').innerText=Object.values(s.jogadores).length;let arena=document.getElementById('arena');arena.innerHTML='';Object.values(s.jogadores).forEach(j=>{let d=document.createElement('div');d.className='player';d.style.left=(j.x/800*100)+'%';d.style.top=(j.y/500*100)+'%';d.innerHTML=`<div class="avatar">${j.skin}</div><div class="name">${j.nome}</div><div class="pts">⭐ ${j.pontos||0}</div>`;arena.appendChild(d)});document.getElementById('feed').innerHTML=s.feed.map(f=>`<div class="feed-item">${f}</div>`).join('')});
</script></body></html>
