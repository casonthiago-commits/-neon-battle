<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON BATTLE ⚡</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#060614;color:#fff;font-family:'Inter';overflow:hidden}
:root{--neon:#22ff88;--cyan:#00e5ff;--pink:#ff2d95;--yellow:#ffe600}
#bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#1a0533 0%,transparent 50%),radial-gradient(circle at 80% 80%,#002b3a 0%,transparent 50%),#060614;z-index:-1}
#bg::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px}
/* MENU */
#menu{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.badge{background:linear-gradient(90deg,var(--pink),#ff6b00);padding:6px 14px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:2px}
.logo{font-family:'Orbitron';font-size:48px;font-weight:900;line-height:.9;margin:14px 0;text-shadow:0 0 30px var(--neon)}
.logo span{background:linear-gradient(90deg,var(--neon),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo2{background:linear-gradient(90deg,var(--pink),#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{opacity:.7;font-size:14px;margin-bottom:20px}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:22px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card input{width:100%;padding:15px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:#fff;margin:8px 0;font-size:16px;outline:none}
.card input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(34,255,136,.2)}
.label{font-size:11px;font-weight:900;letter-spacing:1.5px;opacity:.6;text-align:left;margin-top:10px}
.skins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.skin{font-size:30px;padding:10px 12px;background:rgba(255,255,255,.08);border-radius:18px;border:2px solid transparent;cursor:pointer;transition:.2s}.skin.sel{border-color:var(--neon);background:rgba(34,255,136,.15);transform:scale(1.15);box-shadow:0 0 20px rgba(34,255,136,.4)}
.btn-jogar{width:100%;padding:16px;border:none;border-radius:18px;background:linear-gradient(90deg,var(--neon),var(--cyan));color:#000;font-family:'Orbitron';font-weight:900;font-size:16px;letter-spacing:1px;margin-top:12px;box-shadow:0 10px 30px rgba(34,255,136,.4);cursor:pointer}
.btn-jogar:active{transform:scale(.97)}
.stats{display:flex;gap:10px;width:100%;max-width:400px;margin-top:14px}.stat{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:12px;text-align:center}.stat b{font-size:18px;display:block}.stat span{font-size:11px;opacity:.6}
/* JOGO */
#jogo{display:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}.logo-mini{font-family:'Orbitron';font-weight:900;font-size:18px}.pill{background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);padding:7px 12px;border-radius:999px;font-weight:800;font-size:13px}
#meusPontos{position:fixed;top:68px;right:12px;background:linear-gradient(90deg,var(--yellow),#ff9d00);color:#000;padding:8px 14px;border-radius:999px;font-weight:900;z-index:10;box-shadow:0 5px 20px rgba(255,230,0,.4)}
#arena{margin:0 10px;height:52vh;background:linear-gradient(180deg,rgba(0,60,40,.6),rgba(0,0,0,.6));border:2px solid rgba(34,255,136,.4);border-radius:28px;position:relative;overflow:hidden;box-shadow:inset 0 0 40px rgba(34,255,136,.1)}
.player{position:absolute;transform:translate(-50%,-50%);text-align:center;transition:.1s}.player .avatar{font-size:38px;filter:drop-shadow(0 0 12px var(--neon));animation:float 2s infinite}.player .name{font-size:10px;background:#000d;padding:3px 8px;border-radius:999px;font-weight:700}.pts{font-size:11px;background:var(--yellow);color:#000;font-weight:900;padding:2px 7px;border-radius:999px;display:inline-block;margin-top:2px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#feed{padding:8px 12px}.feed-item{background:rgba(255,255,255,.08);border-left:3px solid var(--neon);padding:7px 11px;border-radius:12px;font-size:13px;margin:3px 0;backdrop-filter:blur(10px)}
.controls{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center}
#joy{width:120px;height:120px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.25);border-radius:50%;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.4)}#knob{width:52px;height:52px;background:linear-gradient(135deg,var(--neon),var(--cyan));border-radius:50%;position:absolute;left:34px;top:34px;box-shadow:0 0 20px var(--neon)}
.btn-prof{background:linear-gradient(90deg,var(--neon),var(--cyan));color:#000;border:none;padding:12px;border-radius:16px;width:100%;font-family:'Orbitron';font-weight:900;margin:0 10px;cursor:pointer}
#duelo{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}.duelo-card{background:#141428;border:2px solid var(--neon);border-radius:28px;padding:24px;width:100%;max-width:400px;text-align:center;box-shadow:0 0 50px rgba(34,255,136,.3);animation:pop .3s}.duelo-card button{width:100%;padding:15px;margin:6px 0;border-radius:16px;border:1px solid rgba(34,255,136,.5);background:rgba(34,255,136,.1);color:#fff;font-size:15px;font-weight:700;cursor:pointer}.duelo-card button:active{background:var(--neon);color:#000}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
</style></head><body><div id="bg"></div>
<div id="menu"><div class="badge">🔥 EDUCAÇÃO FÍSICA • BATTLE ROYALE DO CONHECIMENTO</div><div class="logo">NEON<br><span>BATTLE</span> <span class="logo2">⚡</span></div><p class="sub">Encoste em alguém • Acerte = <b style="color:var(--yellow)">+100 PTS</b> • 5 Min • 20 Jogadores</p><div class="card"><div class="label">👤 SEU NICK</div><input id="nome" placeholder="Ex: Thiaguinho..." value="Player1"><div class="label">🎭 ESCOLHA SEU PERSONAGEM</div><div class="skins" id="skins"></div><div class="label">🔑 CÓDIGO DA SALA</div><input id="codigo" value="NEON1"><button class="btn-jogar" onclick="entrar()">▶️ ENTRAR NA ARENA</button></div><div class="stats"><div class="stat"><b>⚡ 100+</b><span>PERGUNTAS</span></div><div class="stat"><b>🏆 TOP 3</b><span>PÓDIO</span></div><div class="stat"><b>⏰ 5 MIN</b><span>PARTIDA</span></div></div></div>
<div id="jogo"><div class="top"><div class="logo-mini">⚡ NEON <span style="color:var(--neon)">BATTLE</span></div><div class="pill">⏰ <span id="tempo">5:00</span> • 👥 <span id="vivos">0</span></div></div><div id="meusPontos">⭐ 0 PTS</div><button class="btn-prof" onclick="comecar()">▶️ PROFESSOR: INICIAR PARTIDA</button><div id="arena"></div><div id="feed"></div><div class="controls"><div id="joy"><div id="knob"></div></div></div></div>
<div id="duelo"><div class="duelo-card"><div style="font-size:44px">🧠⚔️</div><h3 id="dueloVs" style="font-family:'Orbitron';margin:8px 0">DUELO!</h3><p id="dueloPergunta" style="font-size:18px;font-weight:700;line-height:1.4"></p><div id="dueloOps" style="margin-top:14px"></div></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
let socket=io(),minhaSkin='🦊',pos={x:400,y:250},meusPontos=0,meuNome='';
let skins=['🦊','🐲','⚽','🏀','🏐','🥋','🏋️','🤸','🏃','🚴','🦁','🦸'];
let div=document.getElementById('skins');
skins.forEach(s=>{let b=document.createElement('div');b.className='skin'+(s==='🦊'?' sel':'');b.innerText=s;b.onclick=()=>{minhaSkin=s;document.querySelectorAll('.skin').forEach(e=>e.classList.remove('sel'));b.classList.add('sel')};div.appendChild(b)});
function entrar(){meuNome=document.getElementById('nome').value||'Player';socket.emit('entrar',{codigo:document.getElementById('codigo').value,nome:meuNome,skin:minhaSkin});document.getElementById('menu').style.display='none';document.getElementById('jogo').style.display='block'}
function comecar(){socket.emit('comecar')}
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),movendo=false,dx=0,dy=0;
function jm(e){let r=joy.getBoundingClientRect();let cx=e.touches?e.touches[0].clientX:e.clientX;let cy=e.touches?e.touches[0].clientY:e.clientY;dx=Math.max(-34,Math.min(34,cx-(r.left+60)));dy=Math.max(-34,Math.min(34,cy-(r.top+60)));knob.style.left=(34+dx)+'px';knob.style.top=(34+dy)+'px'}
joy.addEventListener('touchmove',e=>{e.preventDefault();movendo=true;jm(e)});joy.addEventListener('touchend',()=>{movendo=false;dx=dy=0;knob.style.left='34px';knob.style.top='34px'});
setInterval(()=>{if(movendo){pos.x=Math.max(20,Math.min(780,pos.x+dx*0.4));pos.y=Math.max(20,Math.min(420,pos.y+dy*0.4));socket.emit('mover',pos)}},30);
let keys={};addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
setInterval(()=>{let vx=0,vy=0;if(keys['ArrowLeft']||keys['a'])vx=-8;if(keys['ArrowRight']||keys['d'])vx=8;if(keys['ArrowUp']||keys['w'])vy=-8;if(keys['ArrowDown']||keys['s'])vy=8;if(vx||vy){pos.x+=vx;pos.y+=vy;socket.emit('mover',pos)}},30);
socket.on('duelo',d=>{document.getElementById('duelo').style.display='flex';document.getElementById('dueloVs').innerText='⚔️ DUELO vs '+d.oponente;document.getElementById('dueloPergunta').innerText=d.pergunta.q;let ops=document.getElementById('dueloOps');ops.innerHTML='';d.pergunta.a.forEach((alt,i)=>{let b=document.createElement('button');b.innerText=alt;b.onclick=()=>{socket.emit('responder',{correta:i===d.pergunta.c})};ops.appendChild(b)})});
socket.on('duelo-fim',d=>{document.getElementById('duelo').style.display='none';if(d.resultado==='ganhou'){meusPontos=d.pontos;document.getElementById('meusPontos').innerText='⭐ '+meusPontos+' PTS';alert('✅ +100 PONTOS! Total: '+meusPontos)}if(d.resultado==='errou')alert('❌ Errou! Tenta no próximo duelo!')});
socket.on('podio',ranking=>{
let div2=document.createElement('div');div2.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px';
let p1=ranking[0]?.nome||'---',p2=ranking[1]?.nome||'---',p3=ranking[2]?.nome||'---';let k1=ranking[0]?.pontos||0,k2=ranking[1]?.pontos||0,k3=ranking[2]?.pontos||0;
div2.innerHTML=`<div style="background:#141428;border:2px solid #ffe600;border-radius:28px;padding:26px;width:100%;max-width:420px;box-shadow:0 0 60px rgba(255,230,0,.3)"><div style="font-size:64px">🏆</div><h1 style="font-family:Orbitron;margin:0">PÓDIO FINAL!</h1><p style="opacity:.7">Quem fez MAIS PONTOS venceu!</p><div style="display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:22px 0"><div><div style="font-size:32px">🥈</div><div style="background:#94a3b8;padding:12px;border-radius:14px 14px 0 0;height:75px"><b>${p2}</b><br>⭐ ${k2} pts</div></div><div><div style="font-size:44px">🥇</div><div style="background:linear-gradient(180deg,#ffe600,#ff9d00);color:#000;padding:14px;border-radius:14px 14px 0 0;height:115px"><b>${p1}</b><br>👑 CAMPEÃO<br>⭐ ${k1} pts</div></div><div><div style="font-size:32px">🥉</div><div style="background:#b45309;padding:12px;border-radius:14px 14px 0 0;height:55px"><b>${p3}</b><br>⭐ ${k3} pts</div></div></div><button onclick="location.reload()" style="background:linear-gradient(90deg,#22ff88,#00e5ff);color:#000;border:none;padding:15px;border-radius:16px;font-weight:900;width:100%;font-family:Orbitron">🔁 JOGAR DE NOVO</button></div>`;document.body.appendChild(div2);});
socket.on('estado',s=>{let min=Math.floor(s.tempo/60);let seg=String(s.tempo%60).padStart(2,'0');document.getElementById('tempo').innerText=min+':'+seg;document.getElementById('vivos').innerText=Object.values(s.jogadores).length;let arena=document.getElementById('arena');arena.innerHTML='';Object.values(s.jogadores).forEach(j=>{let d=document.createElement('div');d.className='player';d.style.left=(j.x/800*100)+'%';d.style.top=(j.y/500*100)+'%';d.innerHTML=`<div class="avatar">${j.skin}</div><div class="name">${j.nome}</div><div class="pts">⭐ ${j.pontos||0}</div>`;arena.appendChild(d)});document.getElementById('feed').innerHTML=s.feed.map(f=>`<div class="feed-item">${f}</div>`).join('')});
</script></body></html>
