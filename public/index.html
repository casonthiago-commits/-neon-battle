<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON BATTLE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050510;color:#fff;font-family:'Segoe UI',Arial;text-align:center;overflow-x:hidden}
h1{font-size:42px;background:linear-gradient(90deg,#a855f7,#ec4899,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 30px #a855f7}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:20px;max-width:420px;margin:20px auto}
input{width:100%;padding:14px;border-radius:12px;border:none;margin:8px 0;font-size:16px;background:#1e1e3a;color:#fff}
.skins{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.skin{font-size:36px;padding:10px;border-radius:14px;cursor:pointer;border:2px solid transparent;background:#1e1e3a}.skin.sel{border-color:#ec4899;box-shadow:0 0 15px #ec4899}
button{padding:14px 28px;border:none;border-radius:14px;font-weight:900;cursor:pointer;font-size:16px}
.btn-play{background:linear-gradient(90deg,#a855f7,#ec4899);color:#fff;width:100%}
#arena{position:relative;width:800px;max-width:96vw;height:500px;margin:10px auto;background:radial-gradient(circle at center,#1a1a3a 0%,#050510 70%);border:3px solid #a855f7;border-radius:20px;overflow:hidden;box-shadow:0 0 40px #a855f766;touch-action:none}
#zona{position:absolute;border:2px dashed #ec4899;border-radius:50%;transform:translate(-50%,-50%);left:400px;top:250px;pointer-events:none}
.player{position:absolute;font-size:34px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 10px #22d3ee);transition:.1s}
.player b{font-size:10px;display:block;background:#000c;color:#fff;padding:2px 6px;border-radius:8px}
.bar{height:5px;background:#22c55e;border-radius:5px;margin-top:2px}
#feed{max-width:800px;margin:auto;text-align:left}
.feed-item{background:#1e1e3a;padding:8px 12px;border-radius:10px;margin:4px;border-left:4px solid #ec4899}
#dashBtn{position:fixed;bottom:20px;right:20px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#a855f7);font-size:30px;box-shadow:0 0 25px #22d3ee;z-index:10}
</style></head><body>
<div id="menu"><h1>⚡ NEON BATTLE</h1><p>20 jogadores • Battle Royale • Zona encolhe</p>
<div class="card"><input id="nome" placeholder="Seu nick de gamer..." value="Player1">
<p>Escolha sua skin:</p><div class="skins" id="skins"></div>
<input id="codigo" value="NEON1"><button class="btn-play" onclick="entrar()">▶️ JOGAR AGORA</button></div></div>
<div id="jogo" style="display:none"><h2>⏰ <span id="tempo">90</span> | Vivos: <span id="vivos">0</span>/20</h2>
<button onclick="comecar()" style="background:#facc15">▶️ PROFESSOR: INICIAR PARTIDA</button>
<div id="arena"><div id="zona"></div></div><div id="feed"></div>
<button id="dashBtn" onclick="dash()">💨</button><p>Arraste pra mover • Aperte 💨 pra dar DASH • Bata nos outros pra eliminar!</p></div>
<script src="/socket.io/socket.io.js"></script>
<script>
let socket=io(), minhaSkin='🦊';
let skins=['🦊','🐲','👽','🤖','😈','🦄','🐯','👾','🥷','🧛'];
let div=document.getElementById('skins');
skins.forEach(s=>{ let b=document.createElement('div'); b.className='skin'+(s==='🦊'?' sel':''); b.innerText=s; b.onclick=()=>{ minhaSkin=s; document.querySelectorAll('.skin').forEach(e=>e.classList.remove('sel')); b.classList.add('sel'); }; div.appendChild(b); });
function entrar(){ socket.emit('entrar',{codigo:document.getElementById('codigo').value,nome:document.getElementById('nome').value,skin:minhaSkin}); document.getElementById('menu').style.display='none'; document.getElementById('jogo').style.display='block'; }
function comecar(){ socket.emit('comecar'); }
function dash(){ socket.emit('dash'); }
let arena=document.getElementById('arena');
function mover(e){ let r=arena.getBoundingClientRect(); let x=e.clientX-r.left, y=e.clientY-r.top; if(e.touches){x=e.touches[0].clientX-r.left;y=e.touches[0].clientY-r.top;} socket.emit('mover',{x,y}); }
arena.addEventListener('mousemove',mover); arena.addEventListener('touchmove',mover);
socket.on('cheia',()=>{alert('Lobby cheio!');location.reload();});
socket.on('estado', s=>{
  document.getElementById('tempo').innerText=s.tempo;
  document.getElementById('vivos').innerText=Object.values(s.jogadores).filter(j=>j.vivo).length;
  document.getElementById('zona').style.width=s.zona*2+'px'; document.getElementById('zona').style.height=s.zona*2+'px';
  let zona=document.getElementById('zona'); arena.innerHTML=''; arena.appendChild(zona);
  Object.values(s.jogadores).forEach(j=>{
    if(!j.vivo) return;
    let d=document.createElement('div'); d.className='player'; d.style.left=j.x+'px'; d.style.top=j.y+'px';
    d.innerHTML=j.skin+`<b>${j.nome} 💀${j.kills}</b><div class="bar" style="width:${j.vida}%"></div>`;
    arena.appendChild(d);
  });
  document.getElementById('feed').innerHTML=s.feed.map(f=>`<div class="feed-item">${f}</div>`).join('');
});
</script></body></html>
